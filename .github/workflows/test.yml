name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # pytest: so the real-pytest gate tests (tests/test_gate_fooling.py)
      # run instead of skipping. The package itself has no dependencies.
      - run: python -m pip install pytest ruff
      - name: Tests
        run: bash scripts/test.sh
      - name: Ruff (syntax errors and undefined names)
        run: ruff check --select E9,F63,F7,F82 .
