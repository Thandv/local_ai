[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "local-ai"
version = "0.1.0"
description = "Local multi-agent app builder (build-app) and vibe-coding REPL on Ollama"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
claude = ["anthropic"]

[project.scripts]
build-app = "local_ai.build_cli:main"
vibe = "local_ai.vibe:main"
ai-index = "local_ai.indexer:main"

[tool.setuptools]
# The repo root is the `local_ai` package. Packages are listed explicitly so
# tests/ and scripts/ never ship, even if they gain an __init__.py.
packages = ["local_ai", "local_ai.agents", "local_ai.agents.shared"]
package-dir = { local_ai = "." }

[tool.setuptools.package-data]
local_ai = ["repos.json"]
